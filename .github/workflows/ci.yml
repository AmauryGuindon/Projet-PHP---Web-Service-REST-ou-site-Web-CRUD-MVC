name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: PHP ${{ matrix.php }} - Laravel tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite, pdo, pdo_sqlite, mongodb
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          MONGO_DB_HOST: 127.0.0.1
          MONGO_DB_PORT: 27017
          MONGODB_DATABASE: paris_sportifs_test
          MONGODB_DSN: mongodb://127.0.0.1:27017
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          MONGO_DB_HOST: 127.0.0.1
          MONGO_DB_PORT: 27017
          MONGODB_DATABASE: paris_sportifs_test
          MONGODB_DSN: mongodb://127.0.0.1:27017
        run: php artisan test --coverage --min=50

  lint:
    name: PSR-12 via Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: ./vendor/bin/pint --test
