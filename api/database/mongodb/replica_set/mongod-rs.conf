# =============================================================================
# Configuration mongod pour un membre de replica set BetZone
# =============================================================================
# Adapter `port`, `dbPath` et `logPath` pour chaque membre (node1, node2, node3).
# Lancement : mongod --config mongod-rs.conf
# =============================================================================

systemLog:
    destination: file
    path: /var/log/mongodb/node1.log
    logAppend: true

storage:
    dbPath: /var/lib/mongodb/node1
    journal:
        enabled: true
    engine: wiredTiger

net:
    bindIp: 0.0.0.0
    port: 27017

processManagement:
    fork: true
    pidFilePath: /var/run/mongodb/mongod-node1.pid

replication:
    replSetName: betzoneReplSet
    oplogSizeMB: 1024

